# Configuração do Apache para o WebApp ABX.

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# backend/: tudo negado, exceto a API.
<Directory /var/www/html/backend>
    Require all denied
</Directory>
<Directory /var/www/html/backend/api>
    Require all granted
</Directory>

# Artefactos de projeto/infra nunca servidos.
<Directory /var/www/html/docker>
    Require all denied
</Directory>
<FilesMatch "\.(sql|md|ya?ml|conf|example)$">
    Require all denied
</FilesMatch>
<FilesMatch "^(Dockerfile|\.).*">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>

# Cache dos estímulos (imutáveis).
<IfModule mod_headers.c>
    <FilesMatch "\.wav$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</IfModule>
