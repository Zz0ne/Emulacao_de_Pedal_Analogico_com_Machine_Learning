<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>Teste de síntese</title>
  </head>
  <body>
    <h1>Teste de formas de onda</h1>
    <button data-wave="sine">sine</button>
    <button data-wave="square">square</button>
    <button data-wave="sawtooth">sawtooth</button>
    <button data-wave="triangle">triangle</button>
    <hr />
    <button data-flavour="hardware">A (hardware)</button>
    <button data-flavour="emulation">B (emulation)</button>

    <script src="js/audio-synth.js"></script>
    <script>
      let waveform = "sine";
      let flavour = "hardware";

      document.querySelectorAll("[data-wave]").forEach((b) => {
        b.onclick = () => {
          waveform = b.dataset.wave;
          const buf = AudioSynth.generateBuffer({
            freq: 55,
            duration: 2,
            drive: 6,
            waveform,
            flavour,
          });
          AudioSynth.play(buf);
        };
      });

      document.querySelectorAll("[data-flavour]").forEach((b) => {
        b.onclick = () => {
          flavour = b.dataset.flavour;
          const buf = AudioSynth.generateBuffer({
            freq: 55,
            duration: 2,
            drive: 6,
            waveform,
            flavour,
          });
          AudioSynth.play(buf);
        };
      });
    </script>
  </body>
</html>
